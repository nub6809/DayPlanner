<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <Title>Day Planner</Title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Day Planner</h1>
    <aside id="archive">
      <button type="button" id="archive-close">×</button>
      <h2>Archive</h2>
      <ul id="archive-list"></ul>
    </aside> <!-- sidebar for archived day plans -->
    <button type="button" id="archive-toggle">Archive</button>
    <form id="event-form">
        <input id="title" type="text" placeholder="Event title" required>
        <input id="start" type="time" required>
        <input id="end" type="time" required>
        <input id="color" type="color" value="#4f6bed">
        <button type="submit">Add event</button>   <!-- the button lives here -->
    </form>
    <p id="message"></p>
    <p id="warning"></p>
    <button id="save-button">Save Day Plan</button>
<div id="planner"></div>
<script src="script.js"></script>
  </body>
</html>
